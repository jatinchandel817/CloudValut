# ============================================================
#  Distributed File Storage – Application Configuration
# ============================================================
#  Copy this file to application.properties and fill in your
#  own values.  Never commit real credentials to version control.
# ============================================================

# ---- Datasource (MariaDB / MySQL) ----
spring.datasource.url=jdbc:mariadb://localhost:3306/distributed_file_storage?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=your_password_here
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# ---- Multipart file upload limits ----
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ---- Local storage path ----
storage.local.path=./uploads

# ---- AWS S3 configuration ----
# Leave empty to disable S3 storage.
# Credentials are read from the environment / AWS credentials chain,
# NEVER hardcoded here.
aws.region=
aws.s3.bucket=

# ---- Google Cloud Storage configuration ----
# Leave empty to disable GCS storage.
# Credentials are read from Application Default Credentials (ADC),
# NEVER hardcoded here.
gcp.project-id=
gcp.bucket-name=

# ---- Storage node selection ----
# Which providers are enabled at startup.
# Comma-separated list: LOCAL, S3, GCS
storage.enabled-providers=LOCAL

# ---- Server ----
server.port=8080
