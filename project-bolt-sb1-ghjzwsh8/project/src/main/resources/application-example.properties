# ============================================================
#  Example configuration – copy to application.properties
#  and replace placeholder values with your own.
# ============================================================

# ---- Datasource (MariaDB / MySQL) ----
spring.datasource.url=jdbc:mariadb://localhost:3306/distributed_file_storage?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=CHANGE_ME

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---- Multipart file upload limits ----
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# ---- Local storage ----
storage.local.path=./uploads

# ---- AWS S3 ----
# Set AWS credentials via environment variables:
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# or use an AWS credentials profile / IAM role.
aws.region=us-east-1
aws.s3.bucket=my-distributed-storage-bucket

# ---- Google Cloud Storage ----
# Set GCP credentials via:
#   GOOGLE_APPLICATION_CREDENTIALS=/path/to/service-account.json
# or use Application Default Credentials (gcloud auth application-default login).
gcp.project-id=my-gcp-project-id
gcp.bucket-name=my-gcs-bucket

# ---- Enabled storage providers ----
# Comma-separated: LOCAL, S3, GCS
storage.enabled-providers=LOCAL,S3,GCS

# ---- Server ----
server.port=8080
